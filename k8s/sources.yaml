# Kaynak simülatörleri — redpanda topic'lerine yayın yaparlar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-sensor
spec:
  replicas: 1
  selector:
    matchLabels: { app: source-sensor }
  template:
    metadata:
      labels: { app: source-sensor }
    spec:
      initContainers:
        - name: wait-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 9092; do sleep 2; done']
      containers:
        - name: source-sensor
          image: verim-app
          command: ['node', 'dist/ingest/producer-sensor-sim.js']
          env:
            - name: KAFKA_BROKERS
              value: redpanda:9092
            - name: TICK_MS
              valueFrom:
                configMapKeyRef: { name: verim-config, key: TICK_MS }
            - name: MOVES_PER_TICK
              valueFrom:
                configMapKeyRef: { name: verim-config, key: MOVES_PER_TICK }
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
