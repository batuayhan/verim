# Tek seferlik yükleme işleri (compose'daki seed / graph-load / search-load).
# Yeniden koşturmak için: kubectl -n verim delete job <ad> && kubectl apply -k k8s/
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: { app: seed }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:2.17.2-pg17
          command: ['sh', '-c', 'until pg_isready -h db -U postgres -d verim_mim; do sleep 2; done']
      containers:
        - name: seed
          image: verim-app
          command: ['node', 'dist/mim/seed.js']
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: verim-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@db:5432/verim_mim
            - name: IZ_SCALE
              value: '0'
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: graph-load
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: { app: graph-load }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-graphdb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z graphdb 7687; do sleep 2; done']
      containers:
        - name: graph-load
          image: verim-app
          command: ['node', 'dist/mim/graph-load.js']
          env:
            - name: NEO4J_URL
              value: bolt://graphdb:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: verim-secrets, key: NEO4J_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: search-load
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: { app: search-load }
    spec:
      restartPolicy: Never
      initContainers:
        # db hazır + seed şeması uygulanmış olmalı (reporting_data tablosu)
        - name: wait-seed
          image: timescale/timescaledb:2.17.2-pg17
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: verim-secrets, key: POSTGRES_PASSWORD }
          command:
            - sh
            - -c
            - until psql -h db -U postgres -d verim_mim -tAc 'SELECT 1 FROM reporting_data LIMIT 1' >/dev/null 2>&1; do sleep 2; done
        - name: wait-opensearch
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://opensearch:9200/_cluster/health >/dev/null 2>&1; do sleep 2; done']
      containers:
        - name: search-load
          image: verim-app
          command: ['node', 'dist/search/search-load.js']
          env:
            - name: DATA_BACKEND
              value: mim
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: verim-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@db:5432/verim_mim
            - name: OPENSEARCH_URL
              value: http://opensearch:9200
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
