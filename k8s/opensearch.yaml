# OpenSearch — global arama indeksi (tek düğüm, güvenlik kapalı: kapalı iç ağ)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: { app: opensearch }
  template:
    metadata:
      labels: { app: opensearch }
    spec:
      # Düğümde vm.max_map_count düşükse aşağıdaki privileged init'i aç
      # (yönetilen cluster'ların çoğunda gerekmez / izin verilmez):
      # initContainers:
      #   - name: sysctl
      #     image: busybox:1.36
      #     command: ['sysctl', '-w', 'vm.max_map_count=262144']
      #     securityContext: { privileged: true }
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: 'true'
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: 'true'
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms384m -Xmx384m
            - name: bootstrap.memory_lock
              value: 'false'
          ports:
            - containerPort: 9200
          volumeMounts:
            - name: searchdata
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 90
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: '1', memory: 960Mi }
  volumeClaimTemplates:
    - metadata:
        name: searchdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector: { app: opensearch }
  ports:
    - port: 9200
      targetPort: 9200
