# ÖRNEK değerler — gerçek ortamda bu dosyayı uygulamadan önce şifreleri değiştir
# (ya da kubectl create secret / SealedSecrets / ExternalSecrets kullan).
apiVersion: v1
kind: Secret
metadata:
  name: verim-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: verim-dev
  NEO4J_PASSWORD: verim-graph
  # Dört-göz onay için ikinci kimlik: token:ad:rol1|rol2
  AUTH_TOKENS: 'onay-9f3a2c:onaylayici:onaylayan|admin'
  # Boş bırakılırsa Asistan kendini kapatır, sistemin geri kalanı çalışır
  OPENAI_API_KEY: ''
