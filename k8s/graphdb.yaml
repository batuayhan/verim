# Neo4j — bağlantı analizi graf veritabanı
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graphdb
spec:
  serviceName: graphdb
  replicas: 1
  selector:
    matchLabels: { app: graphdb }
  template:
    metadata:
      labels: { app: graphdb }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: verim-secrets, key: NEO4J_PASSWORD }
            - name: NEO4J_AUTH
              value: neo4j/$(NEO4J_PASSWORD)
            - name: NEO4J_server_memory_heap_max__size
              value: 384m
            - name: NEO4J_server_memory_pagecache_size
              value: 128m
          ports:
            - containerPort: 7474
            - containerPort: 7687
          volumeMounts:
            - name: graphdata
              mountPath: /data
          readinessProbe:
            httpGet: { path: /, port: 7474 }
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 7474 }
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: '1', memory: 768Mi }
  volumeClaimTemplates:
    - metadata:
        name: graphdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: graphdb
spec:
  selector: { app: graphdb }
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
